name: registry

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q

      - name: Validate and preview lineage
        if: github.event_name == 'pull_request'
        run: python scripts/registry.py --check >> "$GITHUB_STEP_SUMMARY"

      - name: Regenerate LINEAGE.md
        if: github.event_name == 'push'
        run: |
          python scripts/registry.py
          if ! git diff --quiet -- LINEAGE.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Regenerate LINEAGE.md" -- LINEAGE.md
            git push
          fi
