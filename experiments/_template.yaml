# Start with README.md examples: one-parent RLVR, then a multi-parent soup.
# Copy to an unused experiments/exp-NNN-short-name.yaml; choose unique experiment/output IDs.
# Use status: running and outputs: [] until checkpoints have evaluation results.
# Rejected experiments are not recorded here: file the "Rejected experiment" issue instead.
id: exp-NNN
title: One-line objective
phase: rlvr                 # a phase id from pipeline.yaml
owner: {name: Your Name, email: you@example.org, github: your-github-handle}
status: planned             # planned | running | paused | accepted | inconclusive
method: short-method-name
code: {repo: example-org/training, commit: abc1234}   # GitHub repository (owner/name) and commit that produced the outputs
inputs:                     # parent checkpoints, pinned exactly as registered
  - {model: parent-model-id, hf: {repo: example-org/parent, revision: abc1234}}
  # souping: list at least two registered parents, each with a `weight:` (sum to 1)
outputs: []
#  - id: new-model-id
#    hf: {repo: example-org/new-model-id, revision: abc1234}   # immutable commit; quote all-digit hashes
#    eval: {commit: abc1234}          # evaluation-repository commit that produced the scores
#    scores: {math: 0.0, code: 0.0, chat: 0.0, safety: 0.0}
# notes: optional free text
